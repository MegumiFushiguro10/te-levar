<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Comando - Telemetria da Arena</title>
    <!-- Chart.js Oficial via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 25px; min-height: 100vh; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        .header h1 { font-size: 1.8rem; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .header-actions { display: flex; gap: 10px; }
        
        .btn { padding: 10px 18px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 14px; transition: 0.2s; }
        .btn-voltar { background: #334155; color: #f8fafc; }
        .btn-voltar:hover { background: #475569; }
        .btn-sair { background: #ef4444; color: white; }
        
        /* CARDS KPI */
        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .card-titulo { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 8px; }
        .card-valor { font-size: 2rem; font-weight: bold; color: #f8fafc; }
        .card-valor.destaque { color: #10b981; }
        .card-valor.tokens { color: #f59e0b; }
        
        /* ÁREA DO GRÁFICO */
        .chart-box { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .chart-box h2 { font-size: 1.2rem; margin-bottom: 20px; color: #e2e8f0; }
        .chart-container { position: relative; height: 350px; width: 100%; }

        .alerta-erro { background: #7f1d1d; border: 1px solid #b91c1c; color: #fecaca; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Painel de Operações & Custos</h1>
        <div class="header-actions">
            <a href="index.html" class="btn btn-voltar">💬 Voltar à Arena</a>
            <button onclick="logout()" class="btn btn-sair">Sair</button>
        </div>
    </div>

    <div id="alertaErro" class="alerta-erro"></div>

    <!-- CARDS DE MÉTRICAS -->
    <div class="cards-grid">
        <div class="card">
            <div class="card-titulo">Tokens Consumidos</div>
            <div class="card-valor tokens" id="totalTokens">0</div>
        </div>
        <div class="card">
            <div class="card-titulo">Total de Mensagens</div>
            <div class="card-valor" id="totalMensagens">0</div>
        </div>
        <div class="card">
            <div class="card-titulo">Guerreiros Cadastrados</div>
            <div class="card-valor destaque" id="totalUsuarios">0</div>
        </div>
    </div>

    <!-- ÁREA DO GRÁFICO -->
    <div class="chart-box">
        <h2>📈 Consumo Diário de Tokens (Gemini API)</h2>
        <div class="chart-container">
            <canvas id="graficoTokens"></canvas>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:3000/api/analytics/tokens";

        window.onload = carregarDashboard;

        async function carregarDashboard() {
            const token = localStorage.getItem('token_saas');
            
            if (!token) {
                alert("Acesso restrito. Faça login primeiro!");
                window.location.href = "index.html";
                return;
            }

            try {
                const res = await fetch(API_URL, {
                    headers: { "Authorization": `Bearer ${token}` }
                });

                if (res.status === 403) {
                    alert("⛔ Acesso Proibido! Apenas administradores possuem crachá para este painel.");
                    window.location.href = "index.html";
                    return;
                }

                if (res.status === 401) {
                    alert("Sessão expirada. Faça login novamente.");
                    logout();
                    return;
                }

                const dados = await res.json();

                if (!dados.sucesso) {
                    throw new Error(dados.erro || "Falha ao consultar analytics");
                }

                // 1. Preenche os Cards
                document.getElementById('totalTokens').innerText = dados.resumo.totalTokens.toLocaleString('pt-BR');
                document.getElementById('totalMensagens').innerText = dados.resumo.totalMensagens.toLocaleString('pt-BR');
                document.getElementById('totalUsuarios').innerText = dados.resumo.totalUsuarios.toLocaleString('pt-BR');

                // 2. Extrai rótulos (dias) e dados (tokens por dia)
                const labels = dados.historicoDiario.map(item => item._id);
                const valores = dados.historicoDiario.map(item => item.tokensNoDia);

                // 3. Renderiza o Chart.js
                renderizarGrafico(labels, valores);

            } catch (erro) {
                const boxErro = document.getElementById('alertaErro');
                boxErro.style.display = 'block';
                boxErro.innerText = "❌ " + erro.message;
            }
        }

        function renderizarGrafico(labels, valores) {
            const ctx = document.getElementById('graficoTokens').getContext('2d');

            // Cria um gradiente elegante para o preenchimento do gráfico
            const gradiente = ctx.createLinearGradient(0, 0, 0, 300);
            gradiente.addColorStop(0, 'rgba(56, 189, 248, 0.5)');
            gradiente.addColorStop(1, 'rgba(56, 189, 248, 0.0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length ? labels : ['Hoje'],
                    datasets: [{
                        label: 'Tokens Utilizados',
                        data: valores.length ? valores : [0],
                        borderColor: '#38bdf8',
                        backgroundColor: gradiente,
                        borderWidth: 3,
                        pointBackgroundColor: '#0284c7',
                        pointBorderColor: '#ffffff',
                        pointRadius: 5,
                        pointHoverRadius: 8,
                        fill: true,
                        tension: 0.35 // Curvatura suave da linha
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: { color: '#cbd5e1', font: { size: 13 } }
                        },
                        tooltip: {
                            callbacks: {
                                label: (context) => ` ${context.parsed.y.toLocaleString('pt-BR')} tokens`
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#334155' },
                            ticks: { color: '#94a3b8' }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: '#334155' },
                            ticks: {
                                color: '#94a3b8',
                                callback: (val) => val.toLocaleString('pt-BR')
                            }
                        }
                    }
                }
            });
        }

        function logout() {
            localStorage.removeItem('token_saas');
            localStorage.removeItem('nome_usuario');
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
